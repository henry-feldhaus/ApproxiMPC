services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: approximpc:dev
    container_name: approximpc-dev
    working_dir: /app
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      ACADOS_SOURCE_DIR: /opt/acados
      LD_LIBRARY_PATH: /opt/acados/lib:${LD_LIBRARY_PATH:-}
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash

  # GPU-enabled variant (opt-in via --profile gpu).
  app-gpu:
    extends:
      service: app
    container_name: approximpc-dev-gpu
    profiles: ["gpu"]
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
