# Data collection run with lap-based episode termination
run:
  episodes: 5
  steps_per_episode: 6000
  render: true
  use_default_reset: false
  lap_termination:
    enabled: true
    target_laps: 1
    method: s_wrap
    wrap_threshold_ratio: 0.2
    auto_timeout:
      enabled: true
      timeout_factor: 2.0
      min_expected_speed_ratio: 0.5

env:
  map: Spielberg
  timestep: 0.01
  integrator: rk4
  model: ks

controller:
  mode: kmpc # choose kmpc (safer default) or stmpc
  ref_speed: 4.0
  kmpc:
    model: ks
    observation_type: kinematic_state
    speed_profile:
      enabled: true
      a_lat_max: 3.5
      min_speed: 1.8
      max_speed: 4.0
      kappa_epsilon: 0.001
      smoothing_window: 11
  stmpc:
    training_mode: race
    model: std
    observation_type: frenet_dynamic_state
    use_std_vehicle_params: true
    startup_speed_offset: 1.5
    reset_with_states: true
    initial_state:
      delta: 0.0
      speed: 3.0
      yaw_rate: 0.0
      slip_angle: 0.0
    runtime_tuning:
      enabled: true
      qalpha: 8.0
      qn: 50.0
      qv: 15.0
      qddelta: 1.0
      qjerk: 0.05
      track_safety_margin: 0.30
      v_max: 8.0
      a_max: 3.0
      jerk_max: 20.0
      jerk_min: -20.0
      ddelta_max: 1.8
      ddelta_min: -1.8
      alat_max: 4.5

perturbation:
  enabled: false
  probability: 0.2
  shove_magnitude: 0.3
  min_steps_between_shoves: 0

dagger:
  enabled: false
  record_noise_vectors: false

output:
  output_dir: outputs/datasets
