# Quick multimap smoke test for parallel execution
base_collector_config: configs/collect_mpc_default.yaml  # Base config to extend

run:
  maps:  # Maps to collect from
    - Spielberg
    - Budapest
    - Monza
  directions:  # Directions to sweep
    - normal
    - reverse
  episodes_per_combo: 2       # Quick validation: minimal episodes
  render: false               # Disable rendering for batch runs
  stop_on_error: false        # Continue on failure

execution:
  mode: parallel              # Parallel execution with 4 workers
  max_workers: 4              # Max concurrent workers

output:
  root_dir: outputs/datasets/multimap_training  # Root directory for multimap outputs
  run_name: null              # Auto-generate UTC timestamp name

# Deep merge these overrides into base_collector_config for testing
collector_overrides:
  lidar:
    enabled: true             # Enable lidar for validation
    env_num_beams: 360        # Simulated lidar beam count
    clip_min: 0.0             # Minimum clipped lidar range (meters)
    clip_max: 15.0            # Maximum clipped lidar range (meters)
    store_raw: false          # Keep dataset small for quick tests
    dtype: float16            # Compact lidar storage format
    binning:
      enabled: true           # Enable downsampling
      n_bins: 60              # Saved bins per lidar scan
      method: min             # Min pooling emphasizes nearby obstacles
  perturbation:
    enabled: true             # Test with perturbations
    probability: 0.2          # 20% of steps receive steering shove
  dagger:
    enabled: true             # Test with DAgger dual-action labeling
